<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="440" viewBox="0 0 1400 440" role="img" aria-label="Education timeline">
  <defs>
    <linearGradient id="eduPanelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081321"/>
      <stop offset="55%" stop-color="#0b1d31"/>
      <stop offset="100%" stop-color="#102b43"/>
    </linearGradient>

    <linearGradient id="eduCardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122d49"/>
      <stop offset="100%" stop-color="#163753"/>
    </linearGradient>

    <linearGradient id="eduAccentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eba055"/>
      <stop offset="100%" stop-color="#ffcc82"/>
    </linearGradient>

    <filter id="eduShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000814" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="440" fill="url(#eduPanelGrad)"/>

  <!-- Subtle background details -->
  <g fill="#ffffff" opacity="0.035">
    <circle cx="1240" cy="65" r="95"/>
    <circle cx="1300" cy="390" r="125"/>
    <circle cx="90" cy="390" r="70"/>
  </g>

  <!-- Inward-facing corner accents -->
  <g fill="none" stroke="#eba055" stroke-width="2" opacity="0.8">
    <path d="M28 58V28H58"/>
    <path d="M1342 28H1372V58"/>
    <path d="M28 382V412H58"/>
    <path d="M1342 412H1372V382"/>
  </g>

  <!-- Header -->
  <g font-family="monospace">
    <rect x="60" y="45" width="72" height="4" rx="2" fill="url(#eduAccentGrad)"/>

    <text x="60" y="82"
          font-size="32"
          font-weight="900"
          letter-spacing="2"
          fill="#ffffff">EDUCATION</text>

    <text x="62" y="105"
          font-size="11"
          letter-spacing="2"
          fill="#8da8c0">ACADEMIC BACKGROUND / LEARNING JOURNEY</text>

    <text x="1340" y="75"
          text-anchor="end"
          font-size="11"
          letter-spacing="1.5"
          fill="#6f8ba5">03 RECORDS</text>
  </g>

  <!-- Timeline -->
  <path d="M78 145V356"
        fill="none"
        stroke="#31516d"
        stroke-width="2"
        stroke-dasharray="4 6"/>

  <!-- Education 01 -->
  <g transform="translate(100 126)" filter="url(#eduShadow)">
    <rect width="1240" height="78" rx="10"
          fill="url(#eduCardGrad)"
          stroke="#294966"
          stroke-width="1"/>

    <rect width="4" height="78" rx="2" fill="#eba055"/>

    <circle cx="-22" cy="39" r="13" fill="#0b1d31" stroke="#eba055" stroke-width="2"/>
    <circle cx="-22" cy="39" r="5" fill="#eba055"/>

    <text x="24" y="27"
          font-family="monospace"
          font-size="15"
          font-weight="800"
          fill="#ffffff">B.Sc. Artificial Intelligence</text>

    <text x="24" y="51"
          font-family="monospace"
          font-size="12"
          fill="#35d9f5">Deggendorf Institute of Technology (DIT)</text>

    <rect x="24" y="60" width="77" height="12" rx="6" fill="#eba055" opacity="0.15"/>

    <text x="62.5" y="69"
          text-anchor="middle"
          font-family="monospace"
          font-size="8"
          font-weight="700"
          letter-spacing="1"
          fill="#ffca83">CURRENT</text>

    <path d="M875 17V61" stroke="#34516b" stroke-width="1"/>

    <text x="900" y="30"
          font-family="monospace"
          font-size="12"
          font-weight="700"
          fill="#eba055">10/2026 – Present</text>

    <text x="900" y="52"
          font-family="monospace"
          font-size="12"
          fill="#b8c7d6">Deggendorf, Germany</text>
  </g>

  <!-- Education 02 -->
  <g transform="translate(100 217)" filter="url(#eduShadow)">
    <rect width="1240" height="78" rx="10"
          fill="url(#eduCardGrad)"
          stroke="#294966"
          stroke-width="1"/>

    <rect width="4" height="78" rx="2" fill="#35d9f5"/>

    <circle cx="-22" cy="39" r="13" fill="#0b1d31" stroke="#35d9f5" stroke-width="2"/>
    <circle cx="-22" cy="39" r="5" fill="#35d9f5"/>

    <text x="24" y="29"
          font-family="monospace"
          font-size="14"
          font-weight="800"
          fill="#ffffff">Bachelor of Computer Application (ICT)</text>

    <text x="24" y="53"
          font-family="monospace"
          font-size="12"
          fill="#35d9f5">Maharshi Dayanand University</text>

    <path d="M875 17V61" stroke="#34516b" stroke-width="1"/>

    <text x="900" y="30"
          font-family="monospace"
          font-size="12"
          font-weight="700"
          fill="#eba055">08/2024 – 07/2026</text>

    <text x="900" y="52"
          font-family="monospace"
          font-size="12"
          fill="#b8c7d6">Rohtak, Haryana, India</text>
  </g>

  <!-- Education 03 -->
  <g transform="translate(100 308)" filter="url(#eduShadow)">
    <rect width="1240" height="78" rx="10"
          fill="url(#eduCardGrad)"
          stroke="#294966"
          stroke-width="1"/>

    <rect width="4" height="78" rx="2" fill="#a78bfa"/>

    <circle cx="-22" cy="39" r="13" fill="#0b1d31" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="-22" cy="39" r="5" fill="#a78bfa"/>

    <text x="24" y="29"
          font-family="monospace"
          font-size="13"
          font-weight="800"
          fill="#ffffff">Secondary &amp; Higher Secondary Certificate, CBSE</text>

    <text x="24" y="53"
          font-family="monospace"
          font-size="12"
          fill="#35d9f5">Rukmini Devi Public School</text>

    <path d="M875 17V61" stroke="#34516b" stroke-width="1"/>

    <text x="900" y="30"
          font-family="monospace"
          font-size="12"
          font-weight="700"
          fill="#eba055">04/2021 – 04/2024</text>

    <text x="900" y="52"
          font-family="monospace"
          font-size="12"
          fill="#b8c7d6">New Delhi, India</text>
  </g>

  <!-- Footer -->
  <path d="M100 407H1340" stroke="#29445d" stroke-width="1"/>

  <text x="100" y="426"
        font-family="monospace"
        font-size="9"
        letter-spacing="1.5"
        fill="#6f8ba5">EDUCATION / KNOWLEDGE / GROWTH</text>

  <text x="1340" y="426"
        text-anchor="end"
        font-family="monospace"
        font-size="9"
        letter-spacing="1"
        fill="#eba055">CONTINUOUS LEARNING</text>
</svg>
