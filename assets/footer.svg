
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 1400 260" role="img" aria-label="Portfolio footer — Thanks for visiting">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081321"/>
      <stop offset="55%" stop-color="#0b1d31"/>
      <stop offset="100%" stop-color="#102b43"/>
    </linearGradient>

    <linearGradient id="footerAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="55%" stop-color="#eba055"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <linearGradient id="footerWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#eba055" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="footerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8da8c0" stroke-width="0.6" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1400" height="260" fill="url(#footerBg)"/>
  <rect width="1400" height="260" fill="url(#footerGrid)"/>

  <!-- Ambient decoration -->
  <circle cx="160" cy="125" r="100" fill="#00d4ff" opacity="0.025"/>
  <circle cx="1250" cy="125" r="115" fill="#eba055" opacity="0.035"/>

  <!-- Inward-facing corner accents -->
  <g fill="none" stroke="#eba055" stroke-width="2" opacity="0.8">
    <path d="M28 48V28H58"/>
    <path d="M1342 28H1372V48"/>
    <path d="M28 212V232H58"/>
    <path d="M1342 232H1372V212"/>
  </g>

  <!-- Top accent -->
  <rect x="60" y="28" width="1280" height="2" rx="1" fill="url(#footerAccent)" opacity="0.8"/>

  <!-- Decorative code symbols -->
  <g font-family="monospace" font-weight="700" fill="#00d4ff" opacity="0.65">
    <text x="105" y="100" font-size="25">&lt;/&gt;</text>
    <text x="1260" y="100" font-size="25">{ }</text>
  </g>

  <!-- Main message -->
  <g text-anchor="middle" font-family="monospace">
    <text x="700" y="88"
          font-size="12"
          font-weight="700"
          letter-spacing="4"
          fill="#eba055">END OF PAGE // BEGINNING OF SOMETHING NEW</text>

    <text x="700" y="133"
          font-size="34"
          font-weight="900"
          letter-spacing="1"
          fill="#ffffff">Thanks for stopping by!</text>

    <text x="700" y="160"
          font-size="14"
          fill="#a9bdcf">Building, learning, and creating — one project at a time.</text>
  </g>

  <!-- Tech tags -->
  <g font-family="monospace" font-size="10" text-anchor="middle">
    <rect x="465" y="183" width="92" height="26" rx="6" fill="#163753" stroke="#294966"/>
    <text x="511" y="200" fill="#35d9f5">BUILD</text>

    <rect x="570" y="183" width="92" height="26" rx="6" fill="#163753" stroke="#294966"/>
    <text x="616" y="200" fill="#ffca83">LEARN</text>

    <rect x="675" y="183" width="92" height="26" rx="6" fill="#163753" stroke="#294966"/>
    <text x="721" y="200" fill="#35d9f5">CREATE</text>

    <rect x="780" y="183" width="92" height="26" rx="6" fill="#163753" stroke="#294966"/>
    <text x="826" y="200" fill="#ffca83">REPEAT</text>
  </g>

  <!-- Footer divider -->
  <path d="M60 224H1340" stroke="#29445d" stroke-width="1"/>

  <!-- Footer metadata -->
  <g font-family="monospace" font-size="9" letter-spacing="1">
    <text x="60" y="244" fill="#6f8ba5">DESIGNED WITH CURIOSITY</text>
    <text x="700" y="244" text-anchor="middle" fill="#8da8c0">OPEN SOURCE • CONTINUOUS LEARNING</text>
    <text x="1340" y="244" text-anchor="end" fill="#eba055">© 2026</text>
  </g>
</svg>
