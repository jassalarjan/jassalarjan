<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="500"
     viewBox="0 0 1400 500"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="about-title about-desc">

  <title id="about-title">About Me — Engineering Profile</title>
  <desc id="about-desc">
    An overview of full-stack development, backend engineering,
    applied AI, and the technologies used to build production-ready
    web applications.
  </desc>

  <defs>
    <!-- Background -->
    <linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="55%" stop-color="#08213a"/>
      <stop offset="100%" stop-color="#0e2841"/>
    </linearGradient>

    <!-- Cyan-to-amber accent -->
    <linearGradient id="about-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eba055"/>
      <stop offset="55%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0789ff"/>
    </linearGradient>

    <!-- Card surface -->
    <linearGradient id="about-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163a5f" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0b2037" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Background grid -->
    <pattern id="about-grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#ffffff"
            stroke-width="1"
            stroke-opacity="0.045"/>
    </pattern>

    <!-- Ambient glow -->
    <radialGradient id="about-glow">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono {
        font-family: "SFMono-Regular", Consolas,
                     "Liberation Mono", monospace;
      }

      .white { fill: #f5f8ff; }
      .muted { fill: #b8c4d1; }
      .cyan  { fill: #00d4ff; }
      .amber { fill: #eba055; }

      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
      }

      .section-title {
        font-size: 29px;
        font-weight: 900;
        letter-spacing: 1.4px;
      }

      .body {
        font-size: 15px;
        fill: #d5e1ef;
      }

      .card-title {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1.2px;
      }

      .card-description {
        font-size: 12px;
        fill: #b8c4d1;
      }

      .technology {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .card {
        fill: url(#about-panel);
        stroke: #1e4a7a;
        stroke-width: 1.4;
      }

      .tech-chip {
        fill: #102f4e;
        stroke: #1e4a7a;
        stroke-width: 1;
      }

      .corner-accent {
        fill: none;
        stroke: #eba055;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="500" fill="url(#about-bg)"/>
  <rect width="1400" height="500" fill="url(#about-grid)"/>

  <!-- Ambient lighting -->
  <ellipse cx="1280" cy="90"
           rx="270" ry="220"
           fill="url(#about-glow)"/>

  <ellipse cx="60" cy="500"
           rx="250" ry="180"
           fill="url(#about-glow)"/>

  <!-- Panel boundaries -->
  <path d="M0 1H1400"
        fill="none"
        stroke="#087fc3"
        stroke-opacity="0.6"/>

  <path d="M0 499H1400"
        fill="none"
        stroke="#087fc3"
        stroke-opacity="0.35"/>

  <!-- Inward-facing corner accents -->
  <g class="corner-accent">

    <!-- Top-left: opens toward the content -->
    <path d="M36 70V32H74"/>

    <!-- Top-right: opens toward the content -->
    <path d="M1326 32H1364V70"/>

    <!-- Bottom-left: opens toward the content -->
    <path d="M36 430V468H74"/>

    <!-- Bottom-right: opens toward the content -->
    <path d="M1326 468H1364V430"/>

  </g>

  <!-- Section heading -->
  <g transform="translate(68 48)">
    <rect width="74"
          height="4"
          rx="2"
          fill="url(#about-accent)"/>

    <text x="0" y="35"
          class="mono white section-title">ABOUT ME</text>

    <text x="2" y="58"
          class="mono muted eyebrow">
      ENGINEERING MINDSET / PRACTICAL EXECUTION
    </text>
  </g>

  <!-- Main biography card -->
  <g transform="translate(68 139)">
    <rect width="790"
          height="260"
          rx="16"
          class="card"/>

    <rect width="4"
          height="260"
          rx="2"
          fill="url(#about-accent)"/>

    <!-- Bio icon -->
    <g transform="translate(28 25)">
      <circle cx="16" cy="16"
              r="16"
              fill="#0a3151"
              stroke="#00d4ff"
              stroke-opacity="0.7"/>

      <path d="M8 16L13 21L24 10"
            fill="none"
            stroke="#00d4ff"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <text x="44" y="21"
            class="mono cyan card-title">
        FROM IDEA TO DEPLOYMENT
      </text>
    </g>

    <!-- Biography -->
    <text x="28" y="91" class="mono body">
      <tspan x="28" dy="0">I build and deploy full-stack web applications with React and</tspan>
      <tspan x="28" dy="25">TypeScript, supported by Node.js/Express APIs and serverless</tspan>
      <tspan x="28" dy="25">services on Cloudflare Workers. I work with D1 and MongoDB for</tspan>
      <tspan x="28" dy="25">data, JWT authentication and role-based access control for security,</tspan>
      <tspan x="28" dy="25">and Socket.IO for responsive, real-time experiences.</tspan>
    </text>

    <!-- Focus separator -->
    <path d="M28 222H758"
          fill="none"
          stroke="#1e4a7a"
          stroke-width="1"/>

    <text x="28" y="244"
          class="mono amber"
          font-size="12"
          font-weight="700"
          letter-spacing="0.5">
      CURRENT FOCUS
    </text>

    <text x="165" y="244"
          class="mono white"
          font-size="12">
      Backend systems · Applied AI · Production-ready software
    </text>
  </g>

  <!-- Full-stack development card -->
  <g transform="translate(886 139)">
    <rect width="446"
          height="122"
          rx="15"
          class="card"/>

    <rect width="4"
          height="122"
          rx="2"
          fill="#00d4ff"/>

    <!-- Code icon -->
    <g transform="translate(25 29)"
       fill="none"
       stroke="#00d4ff"
       stroke-width="2.1"
       stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M0 4L-10 14L0 24"/>
      <path d="M24 4L34 14L24 24"/>
      <path d="M18 0L6 28"/>
    </g>

    <text x="78" y="39"
          class="mono white card-title">
      FULL-STACK DEVELOPMENT
    </text>

    <text x="78" y="64"
          class="mono card-description">
      React · TypeScript · Node.js · REST APIs
    </text>

    <text x="78" y="85"
          class="mono card-description">
      Authentication · Real-time applications
    </text>

    <text x="78" y="105"
          class="mono cyan"
          font-size="10"
          font-weight="700"
          letter-spacing="1">
      BUILDING END-TO-END PRODUCTS
    </text>
  </g>

  <!-- Backend and AI card -->
  <g transform="translate(886 277)">
    <rect width="446"
          height="122"
          rx="15"
          class="card"/>

    <rect width="4"
          height="122"
          rx="2"
          fill="#eba055"/>

    <!-- AI / engineering icon -->
    <g transform="translate(25 28)"
       fill="none"
       stroke="#eba055"
       stroke-width="2.1"
       stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M17 0L2 17H14L8 34L31 12H18Z"/>
    </g>

    <text x="78" y="39"
          class="mono white card-title">
      BACKEND &amp; AI ENGINEERING
    </text>

    <text x="78" y="64"
          class="mono card-description">
      Serverless · Data systems · Applied NLP
    </text>

    <text x="78" y="85"
          class="mono card-description">
      Secure APIs · Practical AI integrations
    </text>

    <text x="78" y="105"
          class="mono amber"
          font-size="10"
          font-weight="700"
          letter-spacing="1">
      DESIGNING FOR RELIABILITY
    </text>
  </g>

  <!-- Technology stack heading -->
  <text x="68" y="439"
        class="mono muted eyebrow">
    TECH STACK
  </text>

  <!-- Technology chips -->
  <g transform="translate(205 417)">

    <!-- React -->
    <g>
      <rect width="105" height="34" rx="8" class="tech-chip"/>
      <text x="52.5" y="22"
            text-anchor="middle"
            class="mono white technology">REACT</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(115 0)">
      <rect width="125" height="34" rx="8" class="tech-chip"/>
      <text x="62.5" y="22"
            text-anchor="middle"
            class="mono white technology">TYPESCRIPT</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(250 0)">
      <rect width="105" height="34" rx="8" class="tech-chip"/>
      <text x="52.5" y="22"
            text-anchor="middle"
            class="mono white technology">NODE.JS</text>
    </g>

    <!-- Cloudflare -->
    <g transform="translate(365 0)">
      <rect width="125" height="34" rx="8" class="tech-chip"/>
      <text x="62.5" y="22"
            text-anchor="middle"
            class="mono white technology">CLOUDFLARE</text>
    </g>

    <!-- MongoDB -->
    <g transform="translate(500 0)">
      <rect width="110" height="34" rx="8" class="tech-chip"/>
      <text x="55" y="22"
            text-anchor="middle"
            class="mono white technology">MONGODB</text>
    </g>

    <!-- Socket.IO -->
    <g transform="translate(620 0)">
      <rect width="115" height="34" rx="8" class="tech-chip"/>
      <text x="57.5" y="22"
            text-anchor="middle"
            class="mono white technology">SOCKET.IO</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="68" y="482"
        class="mono"
        fill="#6386a8"
        font-size="10"
        letter-spacing="2">
    ABOUT / ENGINEERING / CONTINUOUS LEARNING
  </text>

  <text x="1332" y="482"
        text-anchor="end"
        class="mono"
        fill="#6386a8"
        font-size="10"
        letter-spacing="2">
    BACKEND · AI · FULL-STACK
  </text>

</svg>